
trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
# Install .NET 10 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

# Restore
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: 'BlazorApp1.csproj'

# Build
- task: DotNetCoreCLI@2
  displayName: 'Build Blazor application'
  inputs:
    command: 'build'
    projects: 'BlazorApp1.csproj'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# Publish
- task: DotNetCoreCLI@2
  displayName: 'Publish Blazor application'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'BlazorApp1.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'
    zipAfterPublish: false

# Create ZIP
- task: ArchiveFiles@2
  displayName: 'Create deployment ZIP'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/BlazorApp1.zip'
    replaceExistingArchive: true

# Publish artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish deployment artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
